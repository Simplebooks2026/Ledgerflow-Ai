<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101c2d"><title>LedgerFlow AI — Mobile</title>
<style>
:root{--navy:#101c2d;--navy2:#18283d;--bg:#f4f6fa;--card:#fff;--ink:#172337;--muted:#718096;--line:#e7ebf2;--teal:#16a085;--green:#16845b;--red:#cf4e58;--blue:#4c76e8;--amber:#d78a20;--shadow:0 5px 20px #18283d0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;min-height:100dvh}.top{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 17px;position:sticky;top:0;z-index:5}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:18px;letter-spacing:-.3px}.logo{height:36px;width:36px;border-radius:12px;background:linear-gradient(145deg,#45d6b1,#168c8a);display:grid;place-items:center;color:#092d35;font-weight:900;font-size:19px}.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:#2c4057;color:#d9e7f7;font-weight:700}.eyebrow{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#9eafc4;margin:17px 0 3px}.welcome{font-size:22px;font-weight:750;letter-spacing:-.5px}.sub{color:#aab8c9;font-size:13px;margin-top:2px}.content{padding:20px 16px 104px}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:3px 0 16px}.heading h1{font-size:23px;letter-spacing:-.6px;margin:0}.muted{color:var(--muted)}.small{font-size:12px}.pill{border-radius:999px;background:#e7f7f1;color:#12815e;padding:5px 9px;font-size:11px;font-weight:700;white-space:nowrap}.btn{border:0;border-radius:12px;background:var(--navy);color:white;padding:11px 14px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn.teal{background:var(--teal)}.btn.light{background:#edf2f7;color:var(--ink)}.btn.outline{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.full{width:100%}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:11px}.metric,.panel,.item{background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.metric{padding:15px 14px;min-width:0}.metric .label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}.metric .value{font-size:23px;font-weight:780;letter-spacing:-.8px;margin:9px 0 4px;white-space:nowrap}.metric .trend{font-size:11px;color:var(--green)}.metric .trend.down{color:var(--red)}.ico{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:9px;background:#e9f8f4;color:#138d76;font-size:15px}.panel{padding:17px;margin-top:14px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:15px}.panelhead h2{font-size:16px;margin:0}.link{border:0;background:transparent;color:#3e69d8;font-size:12px;font-weight:700;padding:5px}.chart{height:140px;display:flex;align-items:flex-end;gap:10px;padding:7px 2px 0;border-bottom:1px solid var(--line)}.month{flex:1;height:100%;display:flex;align-items:center;justify-content:flex-end;flex-direction:column;gap:6px;min-width:0}.bars{height:112px;display:flex;align-items:flex-end;gap:4px;width:100%;justify-content:center}.bar{width:clamp(8px,3.4vw,17px);max-width:23px;border-radius:5px 5px 2px 2px;background:#6b8cf0}.bar.exp{background:#75d6bd}.month label{font-size:10px;color:var(--muted)}.legend{display:flex;gap:14px;font-size:11px;color:var(--muted)}.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}.insight{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.insight:last-child{border-bottom:0;padding-bottom:0}.insighticon{height:34px;min-width:34px;border-radius:11px;display:grid;place-items:center;background:#fff2dd;color:#bd7819}.insighticon.blue{background:#eaf0ff;color:#4569d5}.insight strong{font-size:13px;display:block;margin-bottom:3px}.insight p{font-size:12px;color:var(--muted);margin:0}.sectiontitle{font-size:16px;font-weight:750;margin:23px 0 11px}.activity{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.activity:last-child{border-bottom:0}.activity .ico{width:38px;height:38px;min-width:38px}.activitymain{min-width:0;flex:1}.activitymain strong{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.activitymain span{font-size:11px;color:var(--muted)}.amount{font-size:13px;font-weight:750;white-space:nowrap}.positive{color:var(--green)}.negative{color:var(--red)}.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:8;background:#ffffffed;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 5px calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;max-width:1100px;margin:auto}.navbtn{border:0;background:transparent;color:#8793a5;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;min-width:52px;padding:4px 5px}.navbtn .navico{font-size:19px;line-height:22px}.navbtn.active{color:#138c78;font-weight:750}.navbtn.active .navico{background:#e2f7f1;border-radius:10px;padding:3px 10px}.toolbar{display:flex;gap:8px;margin-bottom:13px}.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff;outline:none}.search:focus,input:focus,select:focus,textarea:focus{border-color:#69b9ad;box-shadow:0 0 0 3px #16a08518}.filter{border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 11px;color:var(--ink)}.listcard{background:#fff;border:1px solid var(--line);border-radius:15px;padding:0 13px}.record{padding:14px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.record:last-child{border-bottom:0}.record .recordmain{flex:1;min-width:0}.record strong{font-size:13px;display:block}.record .meta{font-size:11px;color:var(--muted);margin-top:3px}.status{display:inline-block;border-radius:7px;padding:4px 7px;font-size:10px;font-weight:750;background:#edf2f7;color:#65748a}.status.paid,.status.posted,.status.reconciled{background:#e3f7ee;color:#16845b}.status.overdue,.status.uncategorized{background:#fff0e7;color:#c56a28}.status.draft{background:#edf0ff;color:#596bc4}.empty{text-align:center;padding:35px 12px;color:var(--muted);font-size:13px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}.field label{font-size:12px;color:#65748a;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px;outline:none;color:var(--ink)}.field textarea{resize:vertical;min-height:78px}.modalback{position:fixed;inset:0;background:#0b1425a6;z-index:20;display:none;align-items:flex-end;justify-content:center}.modalback.open{display:flex}.modal{background:var(--bg);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px #0002}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{margin:0;font-size:19px}.close{border:0;background:#e8edf4;border-radius:50%;width:34px;height:34px;font-size:20px}.quickgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick{border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 4px;text-align:center;color:var(--ink);font-size:11px;font-weight:650}.quick .qico{font-size:20px;display:block;margin-bottom:7px}.chatbubble{padding:13px 14px;border-radius:15px;background:#fff;border:1px solid var(--line);font-size:13px;margin-bottom:10px}.chatbubble.user{background:#e5f7f1;border-color:#c6ede2;margin-left:24px}.chatinput{display:flex;gap:8px;margin-top:12px}.chatinput input{min-width:0;flex:1;border:1px solid var(--line);border-radius:12px;padding:12px}.reportrow{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;font-size:13px}.reportrow:last-child{border-bottom:0}.reportrow strong{font-variant-numeric:tabular-nums}.toast{position:fixed;z-index:30;bottom:90px;left:50%;transform:translateX(-50%);background:#132338;color:white;border-radius:12px;padding:11px 16px;font-size:12px;box-shadow:0 8px 25px #0002;display:none;max-width:90%;text-align:center}.toast.show{display:block}.hide{display:none!important}.desktopnav{display:none}
@media(min-width:760px){.app{padding-left:230px}.top{margin-left:-230px;padding-left:252px}.desktopnav{display:block;position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--navy);padding:22px 13px;color:#fff;z-index:10}.desktopnav .brand{margin:4px 8px 28px}.navgroup{color:#778ba4;font-size:10px;text-transform:uppercase;letter-spacing:1.2px;padding:15px 12px 7px}.desktopnav .navbtn{flex-direction:row;justify-content:flex-start;width:100%;font-size:13px;gap:12px;padding:11px 12px;border-radius:10px;color:#b2c0d0}.desktopnav .navbtn.active{background:#21364a;color:#72dfc5}.desktopnav .navbtn.active .navico{background:transparent;padding:0}.bottomnav{display:none}.content{padding:25px 26px 50px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}.metric .value{font-size:25px}.modalback{align-items:center}.modal{border-radius:22px}.maincols{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.maincols .panel{margin-top:14px}.maincols .panel:first-child{margin-top:14px}.heading h1{font-size:26px}}
@media(max-width:360px){.content{padding-left:12px;padding-right:12px}.metric{padding:12px 10px}.metric .value{font-size:20px}.navbtn{min-width:45px;font-size:9px}.quickgrid{grid-template-columns:repeat(4,1fr)}}
</style></head>
<body><div class="app">
<header class="top"><div class="toprow"><div class="brand"><div class="logo">L</div><span>LedgerFlow <span style="color:#67dfc4">AI</span></span></div><button class="avatar" id="profileBtn" aria-label="Profile">A</button></div><div class="eyebrow">ACME TRADING CO. · DEMO</div><div class="welcome" id="welcome">Good afternoon 👋</div><div class="sub">Your finances, at a glance.</div></header>
<aside class="desktopnav"><div class="brand"><div class="logo">L</div><span>LedgerFlow <span style="color:#67dfc4">AI</span></span></div><div class="navgroup">Workspace</div><button class="navbtn active" data-page="dashboard"><span class="navico">⌂</span>Dashboard</button><button class="navbtn" data-page="transactions"><span class="navico">⇄</span>Transactions</button><button class="navbtn" data-page="invoices"><span class="navico">▤</span>Invoices</button><button class="navbtn" data-page="expenses"><span class="navico">↘</span>Expenses</button><button class="navbtn" data-page="reports"><span class="navico">▥</span>Reports</button><button class="navbtn" data-page="assistant"><span class="navico">✧</span>AI Assistant</button><div class="navgroup">Manage</div><button class="navbtn" data-page="accounts"><span class="navico">◎</span>Chart of accounts</button><button class="navbtn" data-page="settings"><span class="navico">⚙</span>Settings</button></aside>
<main class="content" id="content"></main>
<nav class="bottomnav" aria-label="Main navigation"><button class="navbtn active" data-page="dashboard"><span class="navico">⌂</span>Home</button><button class="navbtn" data-page="transactions"><span class="navico">⇄</span>Activity</button><button class="navbtn" data-page="invoices"><span class="navico">▤</span>Invoices</button><button class="navbtn" data-page="reports"><span class="navico">▥</span>Reports</button><button class="navbtn" data-page="assistant"><span class="navico">✧</span>Ask AI</button></nav></div>
<div class="modalback" id="modalback"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalhead"><h2 id="modalTitle">Add transaction</h2><button class="close" id="closeModal" aria-label="Close">×</button></div><form id="transactionForm"><div class="field"><label for="txDesc">Description</label><input id="txDesc" required placeholder="e.g. Office supplies"></div><div class="formgrid"><div class="field"><label for="txAmount">Amount (AED)</label><input id="txAmount" type="number" min="0.01" step="0.01" required placeholder="0.00"></div><div class="field"><label for="txType">Type</label><select id="txType"><option value="expense">Expense</option><option value="income">Income</option></select></div></div><div class="formgrid"><div class="field"><label for="txCategory">Category</label><select id="txCategory"><option>Office expenses</option><option>Travel</option><option>Utilities</option><option>Sales revenue</option><option>Professional services</option><option>Other</option></select></div><div class="field"><label for="txDate">Date</label><input id="txDate" type="date" required></div></div><div class="field"><label for="txNote">Note (optional)</label><textarea id="txNote" placeholder="Add a short note"></textarea></div><button class="btn teal full" type="submit">Save transaction</button></form></section></div><div class="toast" id="toast" role="status"></div>
<script>
const seedTransactions=[
{id:1,desc:"Emirates Office Supplies",category:"Office expenses",date:"2026-10-14",amount:-1280.50,status:"posted"},
{id:2,desc:"Invoice INV-2026-041",category:"Sales revenue",date:"2026-10-13",amount:12500,status:"posted"},
{id:3,desc:"DEWA Utilities",category:"Utilities",date:"2026-10-12",amount:-842.75,status:"categorized"},
{id:4,desc:"Client payment — Gulf Design",category:"Sales revenue",date:"2026-10-11",amount:8750,status:"reconciled"},
{id:5,desc:"Office rent · October",category:"Rent",date:"2026-10-10",amount:-6500,status:"posted"},
{id:6,desc:"Taxi & transport",category:"Travel",date:"2026-10-09",amount:-215.00,status:"uncategorized"},
{id:7,desc:"Cloud software subscription",category:"Software",date:"2026-10-08",amount:-399,status:"posted"}];
const seedInvoices=[
{number:"INV-2026-041",client:"Gulf Design Studio",date:"2026-10-02",due:"2026-10-16",amount:12500,status:"sent"},
{number:"INV-2026-040",client:"Palm Retail LLC",date:"2026-09-27",due:"2026-10-11",amount:8750,status:"paid"},
{number:"INV-2026-039",client:"Northstar Media",date:"2026-09-20",due:"2026-10-04",amount:4200,status:"overdue"},
{number:"INV-2026-038",client:"Urban Works",date:"2026-09-18",due:"2026-10-02",amount:6800,status:"paid"}];
let transactions;try{transactions=JSON.parse(localStorage.getItem("lf_transactions"))||seedTransactions}catch(e){transactions=seedTransactions}
let invoices;try{invoices=JSON.parse(localStorage.getItem("lf_invoices"))||seedInvoices}catch(e){invoices=seedInvoices}
let currentPage="dashboard",query="",filter="all",chat=[];
const money=n=>new Intl.NumberFormat("en-AE",{style:"currency",currency:"AED",maximumFractionDigits:2}).format(n);
const shortMoney=n=>"AED "+Math.abs(n).toLocaleString("en-AE",{maximumFractionDigits:0});
const dateFmt=s=>new Date(s+"T12:00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){try{localStorage.setItem("lf_transactions",JSON.stringify(transactions));localStorage.setItem("lf_invoices",JSON.stringify(invoices))}catch(e){}}
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}
function setPage(p){currentPage=p;query="";document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render()}
function header(title,sub,action=""){return `<div class="heading"><div><h1>${title}</h1>${sub?`<div class="muted small" style="margin-top:4px">${sub}</div>`:""}</div>${action}</div>`}
function record(t){return `<div class="record"><div class="ico" style="${t.amount<0?'background:#fff0ec;color:#c9515c':'background:#e5f7f0;color:#16845b'}">${t.amount<0?'↘':'↗'}</div><div class="recordmain"><strong>${esc(t.desc)}</strong><div class="meta">${esc(t.category)} · ${dateFmt(t.date)}</div></div><div style="text-align:right"><div class="amount ${t.amount<0?'negative':'positive'}">${t.amount<0?'−':'+'}${money(Math.abs(t.amount))}</div><span class="status ${esc(t.status)}">${esc(t.status)}</span></div></div>`}
function dash(){let income=transactions.filter(t=>t.amount>0).reduce((a,t)=>a+t.amount,0)+32750;let expenses=Math.abs(transactions.filter(t=>t.amount<0).reduce((a,t)=>a+t.amount,0))+18240;let outstanding=invoices.filter(i=>i.status!=="paid").reduce((a,i)=>a+i.amount,0);return `${header("Dashboard","Wednesday, 14 October 2026",`<button class="btn teal" id="addBtn">＋ Add</button>`)}
<div class="metrics"><div class="metric"><div class="label"><span class="ico">↗</span> Total income</div><div class="value">${shortMoney(income)}</div><div class="trend">↑ 12.8% <span class="muted">vs last month</span></div></div><div class="metric"><div class="label"><span class="ico" style="background:#fff0ec;color:#c9515c">↘</span> Total expenses</div><div class="value">${shortMoney(expenses)}</div><div class="trend down">↑ 4.2% <span class="muted">vs last month</span></div></div><div class="metric"><div class="label"><span class="ico" style="background:#eaf0ff;color:#4c76e8">▤</span> Receivables</div><div class="value">${shortMoney(outstanding)}</div><div class="trend down">${invoices.filter(i=>i.status==="overdue").length} overdue invoices</div></div><div class="metric"><div class="label"><span class="ico" style="background:#fff5dd;color:#b87c16">◷</span> Net profit</div><div class="value">${shortMoney(income-expenses)}</div><div class="trend">↑ 8.6% <span class="muted">this period</span></div></div></div>
<div class="maincols"><div><section class="panel"><div class="panelhead"><h2>Cash flow overview</h2><select class="filter" id="periodSelect" aria-label="Chart period"><option>Last 6 months</option><option>This year</option></select></div><div class="chart">${[["May",48,35],["Jun",65,43],["Jul",53,38],["Aug",78,51],["Sep",62,44],["Oct",88,48]].map(a=>`<div class="month"><div class="bars"><div class="bar" style="height:${a[1]}%"></div><div class="bar exp" style="height:${a[2]}%"></div></div><label>${a[0]}</label></div>`).join("")}</div><div class="legend" style="margin-top:12px"><span><i class="dot" style="background:#6b8cf0"></i>Income</span><span><i class="dot" style="background:#75d6bd"></i>Expenses</span><span class="muted" style="margin-left:auto">Illustrative demo data</span></div></section>
<section class="panel"><div class="panelhead"><h2>Recent transactions</h2><button class="link" data-page="transactions">View all →</button></div>${transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4).map(record).join("")}</section></div>
<div><section class="panel"><div class="panelhead"><h2>AI insights</h2><span class="pill">2 new</span></div><div class="insight"><div class="insighticon">!</div><div><strong>Invoice payment due soon</strong><p>INV-2026-041 · AED 12,500 is due in 2 days.</p></div></div><div class="insight"><div class="insighticon blue">✧</div><div><strong>Uncategorized transaction</strong><p>Taxi & transport · AED 215 needs review before posting.</p></div></div><button class="btn outline full" style="margin-top:14px" data-page="assistant">Ask AI about my finances ↗</button></section>
<section class="panel"><div class="panelhead"><h2>Quick actions</h2></div><div class="quickgrid"><button class="quick" data-modal="transaction"><span class="qico">＋</span>Expense</button><button class="quick" data-page="invoices"><span class="qico">▤</span>Invoice</button><button class="quick" data-page="transactions"><span class="qico">⇄</span>Banking</button><button class="quick" data-page="reports"><span class="qico">▥</span>Reports</button></div></section></div></div>`}
function transactionsPage(){let filtered=transactions.filter(t=>(t.desc+" "+t.category).toLowerCase().includes(query.toLowerCase())&&(filter==="all"||t.status===filter));return `${header("Transactions","Review your income and spending",`<button class="btn teal" id="addBtn">＋ Add</button>`)}<div class="toolbar"><input class="search" id="searchInput" placeholder="⌕  Search transactions..." value="${esc(query)}"><select id="statusFilter" class="filter"><option value="all">All status</option>${["posted","categorized","reconciled","uncategorized"].map(s=>`<option ${filter===s?"selected":""}>${s}</option>`).join("")}</select></div><div class="listcard">${filtered.length?filtered.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(record).join(""):`<div class="empty">No transactions match your search.</div>`}</div><p class="muted small" style="margin-top:12px">Demo mode · Transactions are saved in this browser on this device.</p>`}
function invoicesPage(){return `${header("Invoices","Track customer payments",`<button class="btn teal" id="invoiceBtn">＋ New</button>`)}<div class="metrics"><div class="metric"><div class="label">Outstanding</div><div class="value">${shortMoney(invoices.filter(i=>i.status!=="paid").reduce((a,i)=>a+i.amount,0))}</div></div><div class="metric"><div class="label">Overdue</div><div class="value">${shortMoney(invoices.filter(i=>i.status==="overdue").reduce((a,i)=>a+i.amount,0))}</div></div></div><div class="sectiontitle">All invoices</div><div class="listcard">${invoices.map(i=>`<div class="record"><div class="ico">▤</div><div class="recordmain"><strong>${esc(i.number)}</strong><div class="meta">${esc(i.client)} · Due ${dateFmt(i.due)}</div></div><div style="text-align:right"><div class="amount">${money(i.amount)}</div><span class="status ${i.status}">${i.status}</span>${i.status!=="paid"?`<button class="link markPaid" data-number="${i.number}">Mark paid</button>`:""}</div></div>`).join("")}</div><p class="muted small" style="margin-top:12px">Sample invoices for demonstration. Marking paid updates this local demo only.</p>`}
function expensesPage(){let ex=transactions.filter(t=>t.amount<0);return `${header("Expenses","Keep business spending organised",`<button class="btn teal" id="addBtn">＋ Add</button>`)}<div class="metrics"><div class="metric"><div class="label">This month</div><div class="value">${shortMoney(ex.reduce((a,t)=>a+Math.abs(t.amount),0))}</div><div class="muted small">Recorded in demo</div></div><div class="metric"><div class="label">Transactions</div><div class="value">${ex.length}</div><div class="muted small">Expense items</div></div></div><div class="sectiontitle">Expense activity</div><div class="listcard">${ex.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(record).join("")}</div>`}
function reportsPage(){let inc=transactions.filter(t=>t.amount>0).reduce((a,t)=>a+t.amount,0)+32750,ex=Math.abs(transactions.filter(t=>t.amount<0).reduce((a,t)=>a+t.amount,0))+18240;return `${header("Reports","A simple view of your business finances",`<button class="btn outline" id="exportBtn">⇩ Export CSV</button>`)}<section class="panel"><div class="panelhead"><h2>Profit & loss summary</h2><span class="pill">Demo period</span></div><div class="reportrow"><span>Income</span><strong class="positive">${money(inc)}</strong></div><div class="reportrow"><span>Operating expenses</span><strong class="negative">−${money(ex)}</strong></div><div class="reportrow"><span>Net profit</span><strong>${money(inc-ex)}</strong></div><div class="reportrow"><span>Net profit margin</span><strong>${(100*(inc-ex)/inc).toFixed(1)}%</strong></div></section><section class="panel"><div class="panelhead"><h2>Report centre</h2></div>${[["Profit & Loss","Income, expenses and net profit"],["Balance Sheet","Assets, liabilities and equity"],["Cash Flow","Operating, investing and financing"],["Accounts Receivable Aging","Outstanding customer invoices"],["VAT Summary","Input and output VAT overview"],["Audit Trail","Record of actions and changes"]].map((r,i)=>`<div class="record"><div class="ico" style="background:#eaf0ff;color:#4c76e8">▥</div><div class="recordmain"><strong>${r[0]}</strong><div class="meta">${r[1]}</div></div><button class="link reportOpen" data-report="${r[0]}">Open →</button></div>`).join("")}</section><p class="muted small" style="margin-top:12px">Illustrative figures only. These reports are not connected to a real accounting ledger.</p>`}
function assistantPage(){return `${header("AI Assistant","Ask questions about the demo finances")}<div class="panel" style="min-height:300px"><div class="chatbubble"><strong>✧ LedgerFlow AI</strong><p style="margin:6px 0 0;color:var(--muted)">Hi! I can help explore the sample financial data. Try asking about expenses, overdue invoices, or profit. This demo assistant uses simple local responses, not a live AI service.</p></div><div id="chatMessages">${chat.map(m=>`<div class="chatbubble ${m.role==="user"?"user":""}">${esc(m.text)}</div>`).join("")}</div><div class="sectiontitle" style="font-size:12px;margin-top:18px">TRY ASKING</div><div style="display:flex;flex-wrap:wrap;gap:7px"><button class="btn light prompt" data-prompt="Which invoices are overdue?">Overdue invoices</button><button class="btn light prompt" data-prompt="Summarise expenses">Summarise expenses</button><button class="btn light prompt" data-prompt="What is the net profit?">Net profit</button></div><form id="chatForm" class="chatinput"><input id="chatInput" placeholder="Ask a finance question..." required><button class="btn teal">Send</button></form></div><p class="muted small" style="margin-top:12px">AI integration requires a configured backend. No data is sent to an AI service in this prototype.</p>`}
const accounts=[["1000","Bank account","Asset"],["1100","Accounts receivable","Asset"],["1200","Office equipment","Asset"],["2000","Accounts payable","Liability"],["2100","VAT payable","Liability"],["3000","Owner's equity","Equity"],["4000","Sales revenue","Revenue"],["5000","Office expenses","Expense"],["5100","Rent expense","Expense"],["5200","Utilities","Expense"],["5300","Travel","Expense"]];
function accountsPage(){return `${header("Chart of accounts","Your accounting categories")}<div class="toolbar"><input id="accountSearch" class="search" placeholder="⌕  Find an account"></div><div class="listcard" id="accountList">${accountRows("")}</div>`}
function accountRows(q){return accounts.filter(a=>a.join(" ").toLowerCase().includes(q.toLowerCase())).map(a=>`<div class="record"><div class="ico">◎</div><div class="recordmain"><strong>${a[0]} · ${a[1]}</strong><div class="meta">${a[2]}</div></div><span class="status">${a[2]}</span></div>`).join("")}
function settingsPage(){return `${header("Settings","Demo company preferences")}<section class="panel"><div class="panelhead"><h2>Company profile</h2><span class="pill">Demo</span></div><div class="field"><label>Company name</label><input value="Acme Trading Co. (Demo)"></div><div class="formgrid"><div class="field"><label>Base currency</label><select><option>AED — UAE Dirham</option><option>USD — US Dollar</option><option>EUR — Euro</option></select></div><div class="field"><label>Language</label><select id="language"><option>English</option><option>العربية (Arabic demo)</option></select></div></div><div class="field"><label>Accounting method</label><select><option>Accrual</option><option>Cash</option></select></div><button class="btn teal full" id="saveSettings">Save preferences</button></section><section class="panel"><div class="panelhead"><h2>Data & privacy</h2></div><p class="muted small">This prototype stores transactions and invoice status in this browser's local storage. It has no login, cloud database, server backup, or real AI connection.</p><button class="btn outline full" id="resetDemo">Reset demo data</button></section>`}
function render(){const c=document.getElementById("content");let pages={dashboard:dash,transactions:transactionsPage,invoices:invoicesPage,expenses:expensesPage,reports:reportsPage,assistant:assistantPage,accounts:accountsPage,settings:settingsPage};c.innerHTML=(pages[currentPage]||dash)();bindPage()}
function openModal(){document.getElementById("txDate").value=new Date().toISOString().slice(0,10);document.getElementById("modalback").classList.add("open");setTimeout(()=>document.getElementById("txDesc").focus(),50)}
function closeModal(){document.getElementById("modalback").classList.remove("open")}
function answer(q){let s=q.toLowerCase();if(s.includes("overdue")){let list=invoices.filter(i=>i.status==="overdue");return list.length?`There ${list.length===1?"is":"are"} ${list.length} overdue invoice(s): ${list.map(i=>i.number+" for "+money(i.amount)+" ("+i.client+")").join("; ")}. Please verify these sample records.`:"There are no invoices marked overdue in the current demo."}if(s.includes("expense")||s.includes("spend")){let e=transactions.filter(t=>t.amount<0).reduce((a,t)=>a+Math.abs(t.amount),0);return `Recorded expenses in the visible transaction list total ${money(e)} across ${transactions.filter(t=>t.amount<0).length} items. This is a partial demo list, not a full accounting report.`}if(s.includes("profit")){let i=transactions.filter(t=>t.amount>0).reduce((a,t)=>a+t.amount,0)+32750,e=Math.abs(transactions.filter(t=>t.amount<0).reduce((a,t)=>a+t.amount,0))+18240;return `The dashboard's illustrative net profit is ${money(i-e)} (demo income ${money(i)} minus demo expenses ${money(e)}). It is not calculated from a complete posted ledger.`}return "I can answer a few demo questions about overdue invoices, recorded expenses, and the illustrative net profit. For accurate accounting advice, connect a secure backend and use verified ledger data."}
function ask(q){chat.push({role:"user",text:q},{role:"assistant",text:answer(q)});render();document.getElementById("chatMessages")?.scrollIntoView({block:"nearest",behavior:"smooth"})}
function exportCSV(){let rows=[["Date","Description","Category","Amount AED","Status"],...transactions.map(t=>[t.date,t.desc,t.category,t.amount.toFixed(2),t.status])];let csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");let url=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"}));let a=document.createElement("a");a.href=url;a.download="ledgerflow-transactions.csv";a.click();URL.revokeObjectURL(url);toast("CSV export prepared")}
function bindPage(){document.getElementById("addBtn")?.addEventListener("click",openModal);document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>setPage(b.dataset.page));document.querySelectorAll("[data-modal='transaction']").forEach(b=>b.onclick=openModal);document.getElementById("searchInput")?.addEventListener("input",e=>{query=e.target.value;let pos=e.target.selectionStart;render();let el=document.getElementById("searchInput");el.focus();el.setSelectionRange(pos,pos)});document.getElementById("statusFilter")?.addEventListener("change",e=>{filter=e.target.value;render()});document.querySelectorAll(".markPaid").forEach(b=>b.onclick=()=>{let inv=invoices.find(i=>i.number===b.dataset.number);if(inv){inv.status="paid";save();render();toast(inv.number+" marked paid in demo")}});document.getElementById("invoiceBtn")?.addEventListener("click",()=>toast("Invoice creation is a planned next step"));document.getElementById("exportBtn")?.addEventListener("click",exportCSV);document.querySelectorAll(".reportOpen").forEach(b=>b.onclick=()=>toast(b.dataset.report+" preview is a demo placeholder"));document.querySelectorAll(".prompt").forEach(b=>b.onclick=()=>ask(b.dataset.prompt));document.getElementById("chatForm")?.addEventListener("submit",e=>{e.preventDefault();let inp=document.getElementById("chatInput"),q=inp.value.trim();if(q)ask(q)});document.getElementById("accountSearch")?.addEventListener("input",e=>{document.getElementById("accountList").innerHTML=accountRows(e.target.value)});document.getElementById("saveSettings")?.addEventListener("click",()=>toast("Preferences saved for this demo session"));document.getElementById("resetDemo")?.addEventListener("click",()=>{if(confirm("Reset transactions and invoices to sample data?")){transactions=seedTransactions.map(t=>({...t}));invoices=seedInvoices.map(t=>({...t}));save();render();toast("Demo data reset")}});document.getElementById("language")?.addEventListener("change",e=>{if(e.target.selectedIndex===1)toast("Arabic RTL layout is planned for the full build")})}
document.getElementById("transactionForm").addEventListener("submit",e=>{e.preventDefault();let type=document.getElementById("txType").value,amount=Number(document.getElementById("txAmount").value);if(!Number.isFinite(amount)||amount<=0)return;transactions.push({id:Date.now(),desc:document.getElementById("txDesc").value.trim(),category:document.getElementById("txCategory").value,date:document.getElementById("txDate").value,amount:type==="expense"?-Math.round((amount+Number.EPSILON)*100)/100:Math.round((amount+Number.EPSILON)*100)/100,status:"uncategorized",note:document.getElementById("txNote").value});save();closeModal();e.target.reset();setPage(currentPage);toast("Transaction saved on this device")});
document.getElementById("closeModal").onclick=closeModal;document.getElementById("modalback").addEventListener("click",e=>{if(e.target.id==="modalback")closeModal()});document.getElementById("profileBtn").onclick=()=>setPage("settings");document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
let hour=new Date().getHours();document.getElementById("welcome").textContent=(hour<12?"Good morning":hour<18?"Good afternoon":"Good evening")+" 👋";render();
</script></body></html>
